<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Quoted — AI visibility for WordPress">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b3fbf"/>
      <stop offset="0.55" stop-color="#5759c8"/>
      <stop offset="1" stop-color="#0f1014"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Soft grid -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200 M0 320 H1200 M0 400 H1200 M0 480 H1200 M0 560 H1200"/>
    <path d="M120 0 V630 M240 0 V630 M360 0 V630 M480 0 V630 M600 0 V630 M720 0 V630 M840 0 V630 M960 0 V630 M1080 0 V630"/>
  </g>

  <!-- Logo mark -->
  <g transform="translate(80 80)">
    <rect width="72" height="72" rx="16" fill="#ffffff" fill-opacity="0.16"/>
    <circle cx="36" cy="34" r="17" fill="none" stroke="#ffffff" stroke-width="5"/>
    <path d="M46 42 c2 2 2.8 4.8 2 7.6 c-0.6 2.8 -2.4 4.8 -5.2 6" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <circle cx="48" cy="44" r="3.6" fill="#ffffff"/>
  </g>

  <!-- Wordmark -->
  <text x="180" y="135" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="40" letter-spacing="-0.02em">Quoted</text>

  <!-- Headline -->
  <text x="80" y="350" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="78" letter-spacing="-0.03em">AI visibility</text>
  <text x="80" y="430" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="78" letter-spacing="-0.03em">for WordPress.</text>

  <!-- Subtitle -->
  <text x="80" y="495" fill="#ffffff" fill-opacity="0.74" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="26" letter-spacing="-0.01em">llms.txt · clean Markdown · crawler controls · schema</text>

  <!-- URL bottom -->
  <text x="80" y="580" fill="#ffffff" fill-opacity="0.55" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="18">quotedeasy.com</text>
</svg>
